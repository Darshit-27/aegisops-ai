apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegisops-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Darshit-27/aegisops-ai.git
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
